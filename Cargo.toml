[workspace]
members = [
  "crates/cfy-api",
  "crates/cfy-app",
  "crates/cfy-auth",
  "crates/cfy-cli",
  "crates/cfy-config",
  "crates/cfy-core",
  "crates/cfy-build",
  "crates/cfy-deploy",
  "crates/cfy-dev",
  "crates/cfy-organization",
  "crates/cfy-store",
  "crates/cfy-tunnel",
  "crates/cfy-extension-adapter",
  "crates/cfy-process",
  "crates/cfy-docs",
  "crates/cfy-hydrogen",
]
default-members = ["crates/cfy-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/yan-ad/catify"

[workspace.dependencies]
base64 = "0.22"
async-trait = "0.1.89"
cfy-api = { version = "0.1.0", path = "crates/cfy-api" }
cfy-app = { version = "0.1.0", path = "crates/cfy-app" }
cfy-auth = { version = "0.1.0", path = "crates/cfy-auth" }
cfy-build = { version = "0.1.0", path = "crates/cfy-build" }
cfy-deploy = { version = "0.1.0", path = "crates/cfy-deploy" }
cfy-dev = { version = "0.1.0", path = "crates/cfy-dev" }
cfy-docs = { version = "0.1.0", path = "crates/cfy-docs" }
cfy-hydrogen = { version = "0.1.0", path = "crates/cfy-hydrogen" }
cfy-organization = { version = "0.1.0", path = "crates/cfy-organization" }
cfy-store = { version = "0.1.0", path = "crates/cfy-store" }
cfy-tunnel = { version = "0.1.0", path = "crates/cfy-tunnel" }
cfy-config = { version = "0.1.0", path = "crates/cfy-config" }
cfy-core = { version = "0.1.0", path = "crates/cfy-core" }
cfy-extension-adapter = { version = "0.1.0", path = "crates/cfy-extension-adapter" }
cfy-process = { version = "0.1.0", path = "crates/cfy-process" }
clap = { version = "4.5.45", features = ["derive", "env"] }
clap_complete = "4.6.9"
crossterm = "0.29"
keyring = { version = "3.6.3", default-features = false }
notify = "8.2.0"
ratatui = "0.30"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
semver = "1.0.26"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.5"
url = { version = "2.5.7", features = ["serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.dependencies.libc]
version = "0.2.175"

[workspace.dependencies.windows-sys]
version = "0.61.0"
features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
]
