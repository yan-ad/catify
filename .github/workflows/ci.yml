name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p cfy-cli --locked -- --help
      - run: cargo build --release -p cfy-cli --locked
      - name: Benchmark cfy smoke
        run: |
          BENCH_ITERATIONS=3 SHOPIFY_BIN=target/release/cfy ./benchmarks/run.sh
          test -s benchmarks/results/latest.json

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories bans licenses sources

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests
      - run: ./scripts/check-inventory.sh
